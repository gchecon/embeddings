[project]
name = "pdf-embedding-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "transformers>=4.40,<5.0",
    "torch>=2.0",
    "pymupdf>=1.24",
    "pytesseract>=0.3",
    "langdetect>=1.0",
    "Pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["database", "services", "routes"]