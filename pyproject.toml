[project]
name = "pdf-embedding-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "qdrant-client>=1.18,<1.19",
    "sentence-transformers>=3.0",
    "transformers>=4.40,<5.0",
    "torch>=2.0",
    "pymupdf>=1.24",
    "pytesseract>=0.3",
    "langdetect>=1.0",
    "Pillow>=10.0",
    "einops>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["database", "services", "routes"]

[tool.uv]
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true